# /etc/nginx/sites-available/ephem → ссылка в sites-enabled. Сертификат добавляет certbot --nginx.
limit_req_zone $binary_remote_addr zone=ephem:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ephem.2-27-32-216.sslip.io;

    client_max_body_size 8k;

    location / {
        limit_req zone=ephem burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}
